---
- name: Run datalab purl service
  hosts: all
  gather_facts: false

  roles:
    - role: ssl
      name: Setup certbot for automated renewal
      tags: [setup]

  vars:
    ghcr_token: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      33663434623761613839616530393534383032333766336463623135373236396661316435343038
      6463386266663133656465663165633161626163316139620a616334363162303364633732613264
      38343030393136386133636237656663303038376630343066653535336131363032393538626330
      3537663834376230390a323836356435343537616130656565633036656464396438663430323530
      61326230373262376139393162386535356339363861663034393331623332666438313365653631
      6466306136616335666361376134323362653637653162313738
    ghcr_user: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      63396362623734353764653539373432303533383962333035656634643132353135326336633536
      6365343634633838386265303639623236663366393463650a376635393066353136636131656530
      31666463343333333533373136323832313764636634316538383332386130613464353030316439
      6462646562333131370a303366366462633534643061666138303030353161333665303261396565
      3664

  tasks:
    - name: Start Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Login to ghcr.io
      community.docker.docker_login:
        state: present
        registry_url: ghcr.io
        username: "{{ ghcr_user }}"
        password: "{{ ghcr_token }}"

    - name: Create a Docker volume for certbot-conf (mounted to /etc/letsencrypt)
      community.docker.docker_volume:
        name: certbot-conf

    - name: Create a Docker volume for certbot-www (mounted to /var/www/certbot)
      community.docker.docker_volume:
        name: certbot-www

    - name: Get datalab-purl container
      community.docker.docker_image_pull:
        name: ghcr.io/datalab-org/datalab-purl:latest
        pull: always

    - name: Launch container
      community.docker.docker_container:
        name: datalab-purl
        image: ghcr.io/datalab-org/datalab-purl:latest
        state: started
        restart_policy: always
        volumes:
          - certbot-conf:/etc/letsencrypt
          - certbot-www:/var/www/certbot
        recreate: true
        ports:
          - 80:80
          - 443:443
