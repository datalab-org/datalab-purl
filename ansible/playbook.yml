---
- name: Run datalab purl service
  hosts: all
  gather_facts: false

  roles:
    - role: ssl
      name: Setup certbot for automated renewal
      tags: [setup]

  vars:
    ghcr_token: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      35366331616232653334356635353335383637333332626438383463626632343965643361323830
      3962376331376136373630306338393761363530363130620a623533643339613133363631303734
      33393430333764333835343330306333393735353131373065336662666463616562353634363932
      6339613430646630660a633631313136653037356466306662366336666266373535323833366431
      66323766626565613133306262663136623839636665393231666334353838646637623730666362
      3737653666386164636333323839663062356537353637623435
    ghcr_user: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      63396362623734353764653539373432303533383962333035656634643132353135326336633536
      6365343634633838386265303639623236663366393463650a376635393066353136636131656530
      31666463343333333533373136323832313764636634316538383332386130613464353030316439
      6462646562333131370a303366366462633534643061666138303030353161333665303261396565
      3664

  tasks:
    - name: Start Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Login to ghcr.io
      community.docker.docker_login:
        state: present
        registry_url: ghcr.io
        username: "{{ ghcr_user }}"
        password: "{{ ghcr_token }}"

    - name: Create a Docker volume for certbot-conf (mounted to /etc/letsencrypt)
      community.docker.docker_volume:
        name: certbot-conf

    - name: Create a Docker volume for certbot-www (mounted to /var/www/certbot)
      community.docker.docker_volume:
        name: certbot-www

    - name: Get datalab-purl container
      community.docker.docker_image_pull:
        name: ghcr.io/datalab-org/datalab-purl:latest
        pull: always

    - name: Launch container
      community.docker.docker_container:
        name: datalab-purl
        image: ghcr.io/datalab-org/datalab-purl:latest
        state: started
        restart_policy: always
        volumes:
          - certbot-conf:/etc/letsencrypt
          - certbot-www:/var/www/certbot
        recreate: true
        ports:
          - 80:80
          - 443:443
