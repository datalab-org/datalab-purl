---
- name: Run datalab purl service
  hosts: all
  gather_facts: false

  roles:
    - role: ssl
      name: Setup certbot for automated renewal
      tags: [setup]

  vars:
    ghcr_token: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      64633737326539373832393636626337666565373838623766323533303863363834303731376630
      3538356537626435646531353663343838646437653039620a613932623866633232633237313466
      37386632333035656362336266623531663462363164356237326237393030653435333936623836
      3533616661353464650a383963393533663037633535373637373461376333386334333462616537
      63346465643339313062333539383031336366363938393836303739303464303436613464646236
      35626438353932303364666431363631323331373165656635393138316461303730353031616530
      31313634306264386636636632383563303730303230643765646530663235333164373764343333
      30393366336261613036393231366437626235623762316434343634616366323131353065366161
      3930
    ghcr_user: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      63396362623734353764653539373432303533383962333035656634643132353135326336633536
      6365343634633838386265303639623236663366393463650a376635393066353136636131656530
      31666463343333333533373136323832313764636634316538383332386130613464353030316439
      6462646562333131370a303366366462633534643061666138303030353161333665303261396565
      3664

  tasks:
    - name: Start Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Login to ghcr.io
      community.docker.docker_login:
        state: present
        registry_url: ghcr.io
        username: "{{ ghcr_user }}"
        password: "{{ ghcr_token }}"

    - name: Create a Docker volume for certbot-conf (mounted to /etc/letsencrypt)
      community.docker.docker_volume:
        name: certbot-conf

    - name: Create a Docker volume for certbot-www (mounted to /var/www/certbot)
      community.docker.docker_volume:
        name: certbot-www

    - name: Get datalab-purl container
      community.docker.docker_image_pull:
        name: ghcr.io/datalab-org/datalab-purl:latest
        pull: always

    - name: Launch container
      community.docker.docker_container:
        name: datalab-purl
        image: ghcr.io/datalab-org/datalab-purl:latest
        state: started
        restart_policy: always
        volumes:
          - certbot-conf:/etc/letsencrypt
          - certbot-www:/var/www/certbot
        recreate: true
        ports:
          - 80:80
          - 443:443
